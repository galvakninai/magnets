name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 26/11/2026: deploy-pages ran 0.7s after the upload and found 0 artifacts (twice). Give the artifact time to register.
      - name: Wait for the artifact to register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4

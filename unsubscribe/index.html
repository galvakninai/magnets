<!doctype html><html lang=he dir=rtl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הסרה מהמייל השבועי | vaknin.ai</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F5F7">
<!-- דף ההסרה שהקישור במייל מוביל אליו (?t=<token>). ההסרה קורית רק בלחיצה על הכפתור, כדי
     שסורקי קישורים בתיבות דואר לא יסירו אנשים בלי שלחצו. ההסרה בלחיצה אחת של Gmail עוברת
     ישירות לפונקציה דרך כותרת List-Unsubscribe, לא דרך הדף הזה. בלי ביקון צפיות. -->
<style>
:root{--bg:#F5F5F7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--acc:#5b2bd1;--ok:#248a3d;--err:#c4291c;
 --f:-apple-system,"SF Hebrew","Assistant",system-ui,"Segoe UI",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#a1a1a6;--acc:#9d7bff;--ok:#30d158;--err:#ff6961;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#a1a1a6;--acc:#9d7bff;--ok:#30d158;--err:#ff6961;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f);-webkit-font-smoothing:antialiased;
 min-height:100vh;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:440px;background:var(--card);border-radius:20px;padding:28px 24px;text-align:center}
h1{font-size:24px;line-height:1.2;margin:0 0 10px;font-weight:800}
p{margin:0;color:var(--mut)}
button{font:700 17px/1 var(--f);margin-top:22px;height:50px;width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#msg{margin-top:14px;font-weight:600}
#msg.ok{color:var(--ok)}#msg.err{color:var(--err)}
#msg:empty{display:none}
</style>
<main>
 <h1 id=h>להסיר אתכם מהמייל השבועי?</h1>
 <p id=sub>לחיצה אחת, ולא תקבלו יותר את המייל השבועי של vaknin.ai.</p>
 <button id=go type=button>כן, להסיר אותי</button>
 <p id=msg role=status aria-live=polite></p>
</main>
<script>
(function(){
 var FN="https://xhrhyqmuugpkxnfrwnoa.supabase.co/functions/v1/newsletter";
 var t="";try{t=new URLSearchParams(location.search).get("t")||""}catch(e){}
 var go=document.getElementById("go"),msg=document.getElementById("msg");
 function say(s,c){msg.textContent=s;msg.className=c||""}
 if(!/^[a-f0-9]{48}$/.test(t)){go.hidden=true;say("הקישור חסר או לא שלם. פתחו אותו שוב מתוך המייל, או כתבו לנו ל-Galvakninai@gmail.com ונסיר ידנית.","err");return}
 go.addEventListener("click",function(){
  go.disabled=true;go.textContent="מסיר...";say("");
  fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"unsubscribe",token:t})})
  .then(function(r){return r.json().catch(function(){return{ok:false}})})
  .then(function(d){
   if(d&&d.ok){go.hidden=true;document.getElementById("h").textContent="הוסרתם";document.getElementById("sub").textContent="לא תקבלו יותר את המייל השבועי. אם תתחרטו, אפשר להירשם שוב מכל דף מגנט.";return}
   if(d&&d.error==="not_found"){go.hidden=true;say("לא מצאנו את הקישור הזה. כתבו לנו ל-Galvakninai@gmail.com ונסיר ידנית.","err");return}
   go.disabled=false;go.textContent="כן, להסיר אותי";say("משהו נתקע אצלנו. נסו שוב בעוד רגע.","err");
  }).catch(function(){go.disabled=false;go.textContent="כן, להסיר אותי";say("אין חיבור כרגע. נסו שוב בעוד רגע.","err")});
 });
})();
</script>
